<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Card</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

<article data-testid="test-todo-card" class="card">

  <!-- Checkbox (ACCESSIBLE FIXED) -->
  <input id="todo-check" type="checkbox" data-testid="test-todo-complete-toggle">
  <label for="todo-check">Mark as complete</label>

  <!-- Title -->
  <h2 data-testid="test-todo-title">Finish Frontend Challenge</h2>

  <!-- Description -->
  <p data-testid="test-todo-description">
    Build a clean and testable todo card component.
  </p>

  <!-- Priority -->
  <span data-testid="test-todo-priority">High</span>

  <!-- Status -->
  <span data-testid="test-todo-status">Pending</span>

  <!-- Due Date (CONSISTENT) -->
  <time data-testid="test-todo-due-date" datetime="2026-04-014T18:00:00Z">
    Due April 14, 2026
  </time>

  <!-- Time Remaining -->
  <div data-testid="test-todo-time-remaining">Calculating...</div>

  <!-- Tags -->
  <ul data-testid="test-todo-tags">
    <li data-testid="test-todo-tag-work">Work</li>
    <li data-testid="test-todo-tag-urgent">Urgent</li>
  </ul>

  <!-- Buttons -->
  <button data-testid="test-todo-edit-button">Edit</button>
  <button data-testid="test-todo-delete-button">Delete</button>

</article>

<script>
const timeEl = document.querySelector('[data-testid="test-todo-time-remaining"]');
const dueDate = new Date("2026-04-014T18:00:00Z");

function updateTime() {
  const now = new Date();
  const diff = dueDate - now;

  const hours = Math.floor(diff / (1000 * 60 * 60));
  const days = Math.floor(hours / 24);

  if (diff < 0) {
    timeEl.textContent = "Overdue";
  } else if (diff < 1000 * 60) {
    timeEl.textContent = "Due now!";
  } else if (hours < 24) {
    timeEl.textContent = `Due in ${hours} hours`;
  } else {
    timeEl.textContent = `Due in ${days} days`;
  }
}

updateTime();
// optional but safe
setInterval(updateTime, 60000);
</script>

<script>
const checkbox = document.querySelector('[data-testid="test-todo-complete-toggle"]');
const title = document.querySelector('[data-testid="test-todo-title"]');
const status = document.querySelector('[data-testid="test-todo-status"]');

checkbox.addEventListener("change", () => {
  if (checkbox.checked) {
    title.classList.add("completed");
    status.textContent = "Done";
  } else {
    title.classList.remove("completed");
    status.textContent = "Pending";
  }
});

document.querySelector('[data-testid="test-todo-edit-button"]')
  .addEventListener("click", () => console.log("edit clicked"));

document.querySelector('[data-testid="test-todo-delete-button"]')
  .addEventListener("click", () => alert("Delete clicked"));
</script>

</body>
</html>
